# Builds and pushes the API image to GHCR (GitHub Container Registry).
#
# IMPORTANT — monorepo (finance-tracker-prod):
#   GitHub Actions only runs workflows under the REPOSITORY ROOT:
#     .github/workflows/server-deploy.yml
#   This file is kept in sync for documentation / if `server/` is ever its own repo.
#
# Standalone server repo: move this file to `.github/workflows/deploy.yml` at that repo root.

name: Deploy — build and push (GHCR)

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!.github/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/finance-tracker-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
